services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ['npm', 'run', 'migration:run']
    environment:
      - DATABASE_POSTGRES_HOST=database_postgres
    env_file:
      - .env
    depends_on:
      database_postgres:
        condition: service_healthy
    restart: 'no'

  storage-minio:
    image: minio/minio:latest
    container_name: ${PROJECT_NAME}_storage-minio
    command: server /data --console-address ":9001"
    ports:
      - '${STORAGE_MINIO_HOST_PORT:-9020}:9000'
      - '9021:9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - storage-minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    depends_on:
      migrator:
        condition: service_completed_successfully
      database_mongo:
        condition: service_started
      storage-minio:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME}_api
    environment:
      - NODE_ENV=development
      - DATABASE_POSTGRES_HOST=database_postgres
      - DATABASE_MONGO_HOST=database_mongo
      - MONGO_URI=mongodb://database_mongo:27017/backend_database_mongo
      - CACHE_REDIS_HOST=cache_redis
      - QUEUE_RABBITMQ_HOST=queue_rabbitmq
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - STORAGE_MINIO_ENDPOINT=storage-minio
      - STORAGE_MINIO_PORT=9000
      - STORAGE_MINIO_PUBLIC_ENDPOINT=192.168.3.207
      - STORAGE_MINIO_PUBLIC_PORT=9000
      - NODE_OPTIONS=--max-old-space-size=1536
    env_file:
      - .env
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 2048m

  ### DATABASE SERVICE
  database_postgres:
    image: postgres:18
    container_name: ${PROJECT_NAME}_database_postgres
    environment:
      - POSTGRES_USER=${DATABASE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DATABASE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${DATABASE_POSTGRES_NAME}
    ports:
      - '${DATABASE_POSTGRES_PORT}:5432'
    volumes:
      - database_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  database_mongo:
    image: mongo:7
    container_name: ${PROJECT_NAME}_database_mongo
    restart: always
    ports:
      - '${DATABASE_MONGO_PORT}:27017'
    volumes:
      - database_mongo_data:/data/db
      - database_mongo_config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 512m

  cache_redis:
    image: redis:7
    container_name: ${PROJECT_NAME}_cache_redis
    restart: always
    ports:
      - '${CACHE_REDIS_PORT}:6379'
    volumes:
      - cache_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64m

  queue_rabbitmq:
    image: rabbitmq:3.9-management
    container_name: ${PROJECT_NAME}_queue_rabbitmq
    ports:
      - '${QUEUE_RABBITMQ_PORT}:5672'
      - '${QUEUE_RABBITMQ_MANAGEMENT_PORT}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${QUEUE_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_RABBITMQ_PASS}
    volumes:
      - queue_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 300m

  kong:
    image: kong:3.6
    container_name: ${PROJECT_NAME}_kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./kong:/kong/declarative
    depends_on:
      - api
      - keycloak
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ${PROJECT_NAME}_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database_keycloak:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      JAVA_OPTS_APPEND: '-Xms128m -Xmx512m'
    ports:
      - '${KEYCLOAK_PORT}:8080'
    depends_on:
      database_keycloak:
        condition: service_healthy
    # start Keycloak in dev mode and import realms placed under /opt/keycloak/data/import
    command: ['start-dev', '--import-realm']
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-config/domestic-backend-realm.json:/opt/keycloak/data/import/domestic-backend-realm.json
    deploy:
      resources:
        limits:
          memory: 600m

  database_keycloak:
    image: postgres:18
    container_name: ${PROJECT_NAME}_database_keycloak
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - database_keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  ### OBSERVABILITY SERVICES (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME}_prometheus
    profiles: ['observability']
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ${PROJECT_NAME}_alertmanager
    profiles: ['observability']
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME}_grafana
    profiles: ['observability']
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256m

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${PROJECT_NAME}_node_exporter
    profiles: ['observability']
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ${PROJECT_NAME}_jaeger
    profiles: ['observability']
    ports:
      - '16686:16686'
      - '14268:14268'
      - '14250:14250'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    volumes:
      - jaeger_data:/tmp
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    image: grafana/loki:latest
    container_name: ${PROJECT_NAME}_loki
    profiles: ['observability']
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  promtail:
    image: grafana/promtail:latest
    container_name: ${PROJECT_NAME}_promtail
    profiles: ['observability']
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128m

  ### SONAR_QUBE SERVICES (Optional for worker)
  sonarqube:
    image: sonarqube:community
    container_name: ${PROJECT_NAME}_sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9001:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    deploy:
      resources:
        limits:
          memory: 512m

  sonar-db:
    image: postgres:13
    container_name: ${PROJECT_NAME}_database_sonarqube
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_database:/var/lib/postgresql
      - sonar_database_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonar_database:
  sonar_database_postgres_data:
  database_postgres_data:
  database_mongo_data:
  database_mongo_config:
  cache_redis_data:
  queue_rabbitmq_data:
  keycloak_data:
  database_keycloak_data:
  storage-minio_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
  loki_data:
