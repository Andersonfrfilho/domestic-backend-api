_format_version: '3.0'
_transform: true

# ---------------------------------------------------------------------------
# Kong API Gateway — Domestic Backend
#
# Upstreams expostos:
#   1. Keycloak — Authorization Code + PKCE (S256)
#      POST /auth/token     → troca code por tokens (BFF injeta client_secret)
#      GET  /auth/authorize → inicia fluxo PKCE (redireciona ao login Keycloak)
#
#   2. BFF — todas as rotas de negócio (pendente — serviço não subido)
#
# Fluxo PKCE:
#   Frontend gera code_verifier + code_challenge(S256)
#   → GET /auth/authorize?code_challenge=...  → Keycloak login page
#   → Keycloak redireciona para redirect_uri?code=AUTH_CODE
#   → BFF POST /auth/token { code, code_verifier } → Kong injeta client_secret
#   → BFF recebe access_token + refresh_token, guarda server-side
#
# O domestic-backend-api NÃO é exposto diretamente pelo Kong.
# ---------------------------------------------------------------------------

services:
  # ── 1. Keycloak — PKCE ───────────────────────────────────────────────────
  - name: keycloak-auth
    url: http://keycloak:8080
    connect_timeout: 10000
    read_timeout: 15000
    write_timeout: 10000

    routes:
      # ── Troca code → tokens (BFF chama isso com code_verifier) ───────────
      - name: auth-token
        paths:
          - /auth/token
        methods:
          - POST
        strip_path: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /realms/domestic-backend/protocol/openid-connect/token
              add:
                body:
                  - 'client_id:domestic-backend-bff'
                  - 'client_secret:backend-bff-client-secret'
          - name: cors
            config:
              origins:
                - 'http://localhost:3000'
                - 'http://localhost:3001'
              methods:
                - POST
                - OPTIONS
              headers:
                - Content-Type
              credentials: false
              max_age: 3600

      # ── Inicia fluxo PKCE (frontend redireciona para cá) ─────────────────
      - name: auth-authorize
        paths:
          - /auth/authorize
        methods:
          - GET
        strip_path: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /realms/domestic-backend/protocol/openid-connect/auth
              add:
                querystring:
                  - 'client_id:domestic-backend-bff'
          - name: cors
            config:
              origins:
                - 'http://localhost:3000'
                - 'http://localhost:3001'
              methods:
                - GET
                - OPTIONS
              headers:
                - Content-Type
              credentials: false
              max_age: 3600

  # ── 2. BFF — rotas de negócio ───────────────────────────────────────────
  - name: bff
    url: http://bff:3001
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      # ── Auth público (registro, login, recuperação de senha, verificação) ──
      - name: bff-auth-public
        paths:
          - /bff/auth/token
          - /bff/auth/refresh
          - /bff/auth/logout
          - /bff/auth/forgot-password
          - /bff/onboarding
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: local
          - name: cors
            config:
              origins:
                - '*'
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Content-Type
                - Authorization
              credentials: false
              max_age: 3600

      # ── Auth autenticado (perfil, documentos, provider) ─────────────────
      - name: bff-auth-protected
        paths:
          - /bff/auth
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
          - name: cors
            config:
              origins:
                - '*'
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - X-Request-Id
              credentials: true
              max_age: 3600

      # ── Rotas públicas (app-config, home) ───────────────────────────────
      - name: bff-public
        paths:
          - /bff/app-config
          - /bff/home
          - /bff/search
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
          - name: cors
            config:
              origins:
                - 'http://localhost:3000'
                - 'http://localhost:3001'
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Content-Type
              credentials: false
              max_age: 3600

      # ── Todas as demais rotas BFF (requerem auth) ───────────────────────
      - name: bff-all
        paths:
          - /bff
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
          - name: cors
            config:
              origins:
                - 'http://localhost:3000'
                - 'http://localhost:3001'
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - X-Request-Id
              credentials: true
              max_age: 3600
