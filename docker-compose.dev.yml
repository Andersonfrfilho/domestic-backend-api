# Stack completa de desenvolvimento local — infra + aplicações.
# Uso:
#   make dev-infra     → apenas infra (postgres, mongo, redis, rabbitmq, keycloak, mailpit)
#   make dev-all       → infra + migrations + seeds + api + bff + worker
services:
  # ── Infra ──────────────────────────────────────────────────────────────

  database_postgres:
    image: postgres:18
    container_name: domestic_database_postgres
    environment:
      - POSTGRES_USER=domestic_api
      - POSTGRES_PASSWORD=domestic123
      - POSTGRES_DB=backend_database_postgres
    ports:
      # Porta 5433 no host para evitar conflito com outros projetos
      - '5433:5432'
    volumes:
      - database_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domestic_api']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  database_mongo:
    image: mongo:7
    container_name: domestic_database_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - database_mongo_data:/data/db
      - database_mongo_config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 512m

  cache_redis:
    image: redis:7
    container_name: domestic_cache_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - cache_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64m

  queue_rabbitmq:
    image: rabbitmq:3.9-management
    container_name: domestic_queue_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${QUEUE_RABBITMQ_USER:-domestic_api}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_RABBITMQ_PASS:-backendapi123}
    volumes:
      - queue_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 300m

  database_keycloak:
    image: postgres:18
    container_name: domestic_database_keycloak
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - database_keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  keycloak:
    image: keycloak/keycloak:25.0
    container_name: domestic_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database_keycloak:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      JAVA_OPTS_APPEND: '-Xms128m -Xmx512m'
    ports:
      - '8080:8080'
    depends_on:
      database_keycloak:
        condition: service_healthy
    command: ['start-dev', '--import-realm']
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-config/domestic-backend-realm.json:/opt/keycloak/data/import/domestic-backend-realm.json
    deploy:
      resources:
        limits:
          memory: 600m

  mailpit:
    image: axllent/mailpit:latest
    container_name: domestic_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    deploy:
      resources:
        limits:
          memory: 64m

  # ── Migrator (profile: app) ────────────────────────────────────────────
  # Roda as migrations do TypeORM antes de subir a API.

  migrator:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: domestic_migrator
    environment:
      NODE_ENV: development
      FORCE_TS: 'true'
      DATABASE_POSTGRES_HOST: database_postgres
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_NAME: backend_database_postgres
      DATABASE_POSTGRES_USER: domestic_api
      DATABASE_POSTGRES_PASSWORD: domestic123
      DATABASE_POSTGRES_TEST_E2E_PASSWORD: domestic123
      DATABASE_MONGO_PASSWORD: domestic123
      DATABASE_MONGO_HOST: database_mongo
    command: ['node', 'scripts/migration.js', 'run']
    depends_on:
      database_postgres:
        condition: service_healthy
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Aplicações (profile: app) ──────────────────────────────────────────

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: domestic_api
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_POSTGRES_HOST: database_postgres
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_NAME: backend_database_postgres
      DATABASE_POSTGRES_USER: domestic_api
      DATABASE_POSTGRES_PASSWORD: domestic123
      DATABASE_MONGO_HOST: database_mongo
      MONGO_URI: mongodb://database_mongo:27017/backend_database_mongo
      CACHE_REDIS_HOST: cache_redis
      CACHE_REDIS_PORT: 6379
      QUEUE_RABBITMQ_HOST: queue_rabbitmq
      QUEUE_RABBITMQ_USER: ${QUEUE_RABBITMQ_USER:-domestic_api}
      QUEUE_RABBITMQ_PASS: ${QUEUE_RABBITMQ_PASS:-backendapi123}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-domestic-backend}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-domestic-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-api-client-secret}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '3333:3333'
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - api_logs:/app/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      database_mongo:
        condition: service_started
      cache_redis:
        condition: service_started
      queue_rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  database_postgres_data:
  database_mongo_data:
  database_mongo_config:
  cache_redis_data:
  queue_rabbitmq_data:
  keycloak_data:
  database_keycloak_data:
  api_logs:

networks:
  default:
    name: domestic_network
    driver: bridge
