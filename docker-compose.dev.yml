# Stack completa de desenvolvimento local — infra + aplicações.
# Uso:
#   make dev-infra     → apenas infra (postgres, mongo, redis, rabbitmq, keycloak, mailpit)
#   make dev-app-all   → infra + API + BFF + Worker (com hot-reload)
services:

  # ── Infra ──────────────────────────────────────────────────────────────

  database_postgres:
    image: postgres:18
    container_name: domestic_database_postgres
    environment:
      - POSTGRES_USER=${DATABASE_POSTGRES_USER:-domestic_api}
      - POSTGRES_PASSWORD=${DATABASE_POSTGRES_PASSWORD:-backendapi123}
      - POSTGRES_DB=${DATABASE_POSTGRES_NAME:-backend_database_postgres}
    ports:
      - '${DATABASE_POSTGRES_PORT:-5433}:5432'
    volumes:
      - database_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_POSTGRES_USER:-domestic_api}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  database_mongo:
    image: mongo:7
    container_name: domestic_database_mongo
    restart: always
    ports:
      - '${DATABASE_MONGO_PORT:-27017}:27017'
    volumes:
      - database_mongo_data:/data/db
      - database_mongo_config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 512m

  cache_redis:
    image: redis:7
    container_name: domestic_cache_redis
    restart: always
    ports:
      - '${CACHE_REDIS_PORT:-6379}:6379'
    volumes:
      - cache_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64m

  queue_rabbitmq:
    image: rabbitmq:3.9-management
    container_name: domestic_queue_rabbitmq
    ports:
      - '${QUEUE_RABBITMQ_PORT:-5672}:5672'
      - '${QUEUE_RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${QUEUE_RABBITMQ_USER:-domestic_api}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_RABBITMQ_PASS:-backendapi123}
    volumes:
      - queue_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 300m

  database_keycloak:
    image: postgres:18
    container_name: domestic_database_keycloak
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - database_keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  keycloak:
    image: keycloak/keycloak:25.0
    container_name: domestic_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database_keycloak:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      JAVA_OPTS_APPEND: "-Xms128m -Xmx512m"
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    depends_on:
      database_keycloak:
        condition: service_healthy
    command: ['start-dev', '--import-realm']
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-config/domestic-backend-realm.json:/opt/keycloak/data/import/domestic-backend-realm.json
    deploy:
      resources:
        limits:
          memory: 600m

  mailpit:
    image: axllent/mailpit:latest
    container_name: domestic_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    deploy:
      resources:
        limits:
          memory: 64m

  # ── Aplicações (profiles: app) ─────────────────────────────────────────

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: domestic_api
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_POSTGRES_HOST: database_postgres
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_NAME: ${DATABASE_POSTGRES_NAME:-backend_database_postgres}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER:-domestic_api}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD:-backendapi123}
      DATABASE_MONGO_HOST: database_mongo
      MONGO_URI: mongodb://database_mongo:27017/${DATABASE_POSTGRES_NAME:-backend_database_mongo}
      CACHE_REDIS_HOST: cache_redis
      CACHE_REDIS_PORT: 6379
      QUEUE_RABBITMQ_HOST: queue_rabbitmq
      QUEUE_RABBITMQ_USER: ${QUEUE_RABBITMQ_USER:-domestic_api}
      QUEUE_RABBITMQ_PASS: ${QUEUE_RABBITMQ_PASS:-backendapi123}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-domestic-backend}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-domestic-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-api-client-secret}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '3333:3333'
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - api_logs:/app/logs
    depends_on:
      database_postgres:
        condition: service_healthy
      database_mongo:
        condition: service_started
      cache_redis:
        condition: service_started
      queue_rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  bff:
    profiles: ['app']
    build:
      context: ../domestic-backend-bff
      dockerfile: Dockerfile.dev
    container_name: domestic_bff
    environment:
      NODE_ENV: development
      PORT: 3335
      MONGO_URI: mongodb://database_mongo:27017/backend_database_mongo
      CACHE_REDIS_HOST: cache_redis
      CACHE_REDIS_PORT: 6379
      API_BASE_URL: http://api:3333
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-domestic-backend}
      KEYCLOAK_CLIENT_ID: ${BFF_KEYCLOAK_CLIENT_ID:-domestic-backend-bff}
      KEYCLOAK_CLIENT_SECRET: ${BFF_KEYCLOAK_CLIENT_SECRET:-backend-bff-client-secret}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '3335:3335'
    volumes:
      - ../domestic-backend-bff/src:/app/src
      - ../domestic-backend-bff/dist:/app/dist
      - bff_logs:/app/logs
    depends_on:
      - api
      - cache_redis
      - database_mongo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

  worker:
    profiles: ['app']
    build:
      context: ../domestic-backend-worker
      dockerfile: Dockerfile.dev
    container_name: domestic_worker
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_POSTGRES_HOST: database_postgres
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_NAME: ${DATABASE_POSTGRES_NAME:-backend_database_postgres}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER:-domestic_api}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD:-backendapi123}
      MONGO_URI: mongodb://database_mongo:27017/backend_database_mongo
      RABBITMQ_URL: amqp://${QUEUE_RABBITMQ_USER:-domestic_api}:${QUEUE_RABBITMQ_PASS:-backendapi123}@queue_rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-zolve.events}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - ../domestic-backend-worker/src:/app/src
      - ../domestic-backend-worker/dist:/app/dist
      - worker_logs:/app/logs
    depends_on:
      database_postgres:
        condition: service_healthy
      queue_rabbitmq:
        condition: service_started
      database_mongo:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  database_postgres_data:
  database_mongo_data:
  database_mongo_config:
  cache_redis_data:
  queue_rabbitmq_data:
  keycloak_data:
  database_keycloak_data:
  api_logs:
  bff_logs:
  worker_logs:

networks:
  default:
    name: domestic_network
    driver: bridge
